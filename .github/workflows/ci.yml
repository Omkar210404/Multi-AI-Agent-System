name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (mock provider, no keys or network needed)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t multi-ai-agent-system .
      - name: Start container and check /health
        run: |
          docker run -d -p 8000:8000 --name app multi-ai-agent-system
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then echo; echo "healthy"; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
